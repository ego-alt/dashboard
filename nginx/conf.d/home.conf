upstream dashboard {
    server dashboard:8000;
}

upstream library {
    server library:5001;
}

upstream calendar {
    server calendar:5002;
}

# HTTP -> HTTPS redirect.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # default_server: requests by LAN IP (e.g. https://192.168.x.x/…) must hit this
    # block or they use another vhost’s defaults (1m body → 413 on upload_book).
    listen 443 ssl default_server;
    http2 on;
    server_name home.local localhost;

    ssl_certificate     /etc/nginx/tls/home.crt;
    ssl_certificate_key /etc/nginx/tls/home.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    client_max_body_size 100m;

    # ---- internal subrequest auth ----
    # Future backends (library, calendar) will reference this via `auth_request`.
    # `internal` means external clients can't call it; only nginx-internal redirects can.
    location = /auth/verify {
        internal;
        proxy_pass              http://dashboard/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie $http_cookie;
        # Forward the API token so native clients (no session cookie) can be
        # authorized here; without this the Bearer header never reaches verify.
        proxy_set_header        Authorization $http_authorization;
    }

    # If a protected upstream returns 401, redirect the browser to login.
    error_page 401 = @login_redirect;
    location @login_redirect {
        return 302 /login?next=$request_uri;
    }

    # ---- library (EPUB app) ----
    # Health check bypasses auth so Docker/nginx can probe liveness.
    location = /library/healthz {
        proxy_pass         http://library/healthz;
        proxy_set_header   Host $host;
    }

    location /library/ {
        auth_request       /auth/verify;
        auth_request_set   $user $upstream_http_x_user;
        proxy_set_header   X-Forwarded-User $user;
        proxy_set_header   X-Forwarded-User-Original "";

        proxy_pass         http://library/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Prefix /library;
    }

    # ---- calendar ----
    location = /calendar/healthz {
        proxy_pass         http://calendar/healthz;
        proxy_set_header   Host $host;
    }

    location /calendar/ {
        auth_request       /auth/verify;
        auth_request_set   $user $upstream_http_x_user;
        proxy_set_header   X-Forwarded-User $user;
        proxy_set_header   X-Forwarded-User-Original "";

        proxy_pass         http://calendar/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Prefix /calendar;
    }

    # ---- dashboard: API + (later) frontend. Catch-all. ----
    location / {
        proxy_pass         http://dashboard;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Defense in depth: strip any client-supplied identity header.
        proxy_set_header   X-Forwarded-User "";
    }
}
