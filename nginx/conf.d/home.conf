# Public OAuth endpoints (dynamic client registration, token): a per-IP rate
# limit so nobody can flood the MCP server's client table or grind at /token.
limit_req_zone $binary_remote_addr zone=mcp_oauth:1m rate=20r/m;

upstream dashboard {
    server dashboard:8000;
}

upstream library {
    server library:5001;
}

upstream calendar {
    server calendar:5002;
}

upstream music {
    server music:5003;
}

# HTTP -> HTTPS redirect.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # default_server: requests by LAN IP (e.g. https://192.168.x.x/…) must hit this
    # block or they use another vhost's defaults (1m body → 413 on upload_book).
    listen 443 ssl default_server;
    http2 on;
    server_name home.local localhost;

    ssl_certificate     /etc/nginx/tls/home.crt;
    ssl_certificate_key /etc/nginx/tls/home.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    client_max_body_size 100m;

    # ---- internal subrequest auth ----
    location = /auth/verify {
        internal;
        proxy_pass              http://dashboard/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie $http_cookie;
        proxy_set_header        Authorization $http_authorization;
    }

    error_page 401 = @login_redirect;
    location @login_redirect {
        return 302 /login?next=$request_uri;
    }

    # ---- library (EPUB app) ----
    location = /library/healthz {
        proxy_pass         http://library/healthz;
        proxy_set_header   Host $host;
    }

    location /library/ {
        auth_request       /auth/verify;
        auth_request_set   $user $upstream_http_x_user;
        proxy_set_header   X-Forwarded-User $user;
        proxy_set_header   X-Forwarded-User-Original "";

        proxy_pass         http://library/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Prefix /library;
    }

    # ---- calendar ----
    location = /calendar/healthz {
        proxy_pass         http://calendar/healthz;
        proxy_set_header   Host $host;
    }

    location /calendar/ {
        auth_request       /auth/verify;
        auth_request_set   $user $upstream_http_x_user;
        proxy_set_header   X-Forwarded-User $user;
        proxy_set_header   X-Forwarded-User-Original "";

        proxy_pass         http://calendar/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Prefix /calendar;
    }

    # ---- music (cassette-deck streamer) ----
    location = /music/healthz {
        proxy_pass         http://music/healthz;
        proxy_set_header   Host $host;
    }

    location /music/ {
        auth_request       /auth/verify;
        auth_request_set   $user $upstream_http_x_user;
        proxy_set_header   X-Forwarded-User $user;
        proxy_set_header   X-Forwarded-User-Original "";

        proxy_pass         http://music/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Prefix /music;
    }

    # Internal: the music app returns X-Accel-Redirect: /_audio/<relpath>, and
    # nginx serves the file directly from the library mount with range/seek.
    location /_audio/ {
        internal;
        alias /data/music/;
    }

    # ---- MCP server (AI assistants): /mcp + its OAuth endpoints ----
    # No auth_request: the MCP server checks bearer tokens itself and must answer
    # 401 with its own WWW-Authenticate (resource_metadata) header. Resolved per
    # request via Docker DNS, so nginx still starts if the mcp container is down.
    location = /mcp {
        resolver           127.0.0.11 valid=30s ipv6=off;
        set                $mcp http://mcp:8100;
        proxy_pass         $mcp;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-User "";
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # OAuth: metadata, dynamic registration, authorize/token/revoke, and the
    # consent + connected-apps pages under /oauth/.
    location ~ ^/(authorize|token|register|revoke)$ {
        limit_req          zone=mcp_oauth burst=20 nodelay;
        limit_req_status   429;
        resolver           127.0.0.11 valid=30s ipv6=off;
        set                $mcp http://mcp:8100;
        proxy_pass         $mcp;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-User "";
    }

    location ^~ /.well-known/oauth- {
        resolver           127.0.0.11 valid=30s ipv6=off;
        set                $mcp http://mcp:8100;
        proxy_pass         $mcp;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location ^~ /oauth/ {
        resolver           127.0.0.11 valid=30s ipv6=off;
        set                $mcp http://mcp:8100;
        proxy_pass         $mcp;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-User "";
    }

    # ---- dashboard: API + frontend. Catch-all. ----
    location / {
        proxy_pass         http://dashboard;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-User "";
    }
}
