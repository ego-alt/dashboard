# Runs on every push to master and on pull requests. The Pi's deploy timer
# (dashboard/scripts/deploy.sh) only ships commits whose CI passed.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"   # matches the Dockerfile's base image
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Tests
        run: uv run pytest -q
      # Advisory until the existing warnings are cleaned up: shows issues
      # inline on the PR without failing the build.
      - name: Lint (advisory)
        continue-on-error: true
        run: uvx ruff@0.9.7 check . --output-format github

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"   # matches mcp/Dockerfile
          enable-cache: true
          cache-dependency-glob: mcp/uv.lock
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Tests
        run: uv run pytest -q
      - name: Lint
        run: uvx ruff@0.9.7 check .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # matches the Dockerfile's node:22 build stage
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint
