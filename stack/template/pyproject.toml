[project]
name = "__NAME__"
version = "0.1.0"
description = "__DESCRIPTION__"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "TID"]

[tool.pytest.ini_options]
testpaths = ["tests"]
