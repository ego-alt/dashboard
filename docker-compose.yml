# Local home-stack compose: nginx (TLS termination, reverse-proxy) +
# dashboard (FastAPI auth provider + Docker monitor).
#
# Bootstrap:
#   1) scripts/dev-certs.sh             # write tls/home.crt + tls/home.key
#   2) docker compose up -d
#   3) docker compose exec dashboard python -m app.cli create-admin <user>
#   4) uv run python scripts/sync_household_users.py
#   5) Open https://localhost (or https://home.local with a hosts entry)

# Apps added in the dashboard's Deploy tab: generated on the Pi by
# scripts/stack_render.py (see docs/APPS.md). Without STACK_APPS_COMPOSE, none.
include:
  - ${STACK_APPS_COMPOSE:-stack/no-apps.yml}

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: home-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Routes for apps added in the Deploy tab, generated by the deploy script.
      - ${DEPLOY_STATE_HOST_DIR:-./data/deploy}/generated/nginx:/etc/nginx/apps:ro
      - ./tls:/etc/nginx/tls:ro
      # X-Accel: nginx serves the audio bytes itself, so it needs the music
      # library mounted read-only at the path the /_audio/ alias points to.
      - ${MUSIC_HOST_DIR:-../tapes/music}:/data/music:ro
    depends_on:
      dashboard:
        condition: service_healthy
      library:
        condition: service_started
      calendar:
        condition: service_started
      music:
        condition: service_started

  dashboard:
    build: .
    image: dashboard:dev
    container_name: dashboard
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/dashboard.db
      SESSION_COOKIE_SECURE: "1"
      BACKUP_STATUS_FILE: /backups/status.json
      # The Deploy tab lists this account's repos. A read-only token lifts GitHub's
      # limit of 60 requests an hour and shows private repos (see docs/DEPLOY.md).
      GITHUB_OWNER: ${GITHUB_OWNER:-ego-alt}
      DEPLOY_GITHUB_TOKEN: ${DEPLOY_GITHUB_TOKEN:-}
      # Extra origins allowed to sign in and save (see .env.example).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Phone apps' APKs, fetched from their GitHub releases (app/routes/phone_apps.py).
      PHONE_APPS_DIR: /data/phone-apps
    # Match the host's docker.sock GID so the non-root app user can read it.
    # Find with: stat -c '%g' /var/run/docker.sock   (Pi/Debian usually 999.)
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only view of the backup run-status the host's restic-backup.sh
      # writes (set BACKUP_STATUS_FILE to this dir in /etc/restic/home-stack.env).
      # A dedicated dir, not the staging dir — no restic creds or staged DBs leak
      # into the dashboard. Missing dir/file just reads as "no backup yet".
      - ${BACKUP_STATUS_DIR:-/var/lib/home-stack-backup-status}:/backups:ro
      # The deploy script's state (scripts/deploy.sh): the Deploy tab reads its
      # status and logs, and writes which apps are enabled and deploy requests.
      - ${DEPLOY_STATE_HOST_DIR:-./data/deploy}:/deploy
    expose:
      - "8000"

  library:
    build: ../library
    image: library:dev
    container_name: library
    restart: unless-stopped
    environment:
      APPLICATION_ROOT: /library
      AUTH_PROXY_HEADER: X-Forwarded-User
      BOOK_DIR: /data/books
      COMIC_DIR: /data/comics
      SECRET_KEY: ${LIBRARY_SECRET_KEY:-}
    volumes:
      - ../library/instance:/app/instance
      - ${LIBRARY_BOOK_DIR:-../library/books}:/data/books
      # Comics (CBZs). Not in the restic backup: it's big and can be
      # downloaded again.
      - ${LIBRARY_COMIC_DIR:-../library/instance/comics}:/data/comics
    expose:
      - "5001"
    labels:
      homehub.enable: "true"
      homehub.name: "Library"
      homehub.route: "/library/"
      homehub.icon: "book"
      homehub.description: "Books and comics"
    # Apply any new database migrations, then serve (same pattern as calendar). Straight from the
    # virtualenv: `uv run` would install the dev tools on every start.
    command:
      - sh
      - -c
      - .venv/bin/flask db upgrade && exec .venv/bin/gunicorn 'app:create_app()' --bind 0.0.0.0:5001 --workers 2 --threads 4 --timeout 120 --worker-class gthread
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  calendar:
    build: ../calendar
    image: calendar:dev
    container_name: calendar
    restart: unless-stopped
    environment:
      APPLICATION_ROOT: /calendar
      AUTH_PROXY_HEADER: X-Forwarded-User
      SECRET_KEY: ${CALENDAR_SECRET_KEY:-}
    volumes:
      - ../calendar/instance:/app/instance
    expose:
      - "5002"
    labels:
      homehub.enable: "true"
      homehub.name: "Calendar"
      homehub.route: "/calendar/"
      homehub.icon: "calendar"
      homehub.description: "Mood tracker + events"
    command:
      - sh
      - -c
      - .venv/bin/flask db upgrade && exec .venv/bin/gunicorn 'app:create_app()' --bind 0.0.0.0:5002 --workers 2 --timeout 120 --worker-class sync
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  music:
    build: ../tapes
    image: music:dev
    container_name: music
    restart: unless-stopped
    environment:
      APPLICATION_ROOT: /music
      AUTH_PROXY_HEADER: X-Forwarded-User
      MUSIC_DIR: /data/music
      USE_X_ACCEL: "1"
      SECRET_KEY: ${MUSIC_SECRET_KEY:-}
      # LLM tag correction (Claude Haiku). Without a key, rips fall back to
      # deterministic cleanup; set LLM_CLEANING=0 to disable even with a key.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_CLEANING: ${LLM_CLEANING:-1}
      # Cover art from MusicBrainz on rip. Set a contact (email/URL) for their UA policy.
      ART_LOOKUP: ${ART_LOOKUP:-1}
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:-}
      # Acoustic-fingerprint dedup (same recording, different URL).
      FINGERPRINT_DEDUP: ${FINGERPRINT_DEDUP:-1}
    volumes:
      - ../tapes/instance:/app/instance
      # Writable: yt-dlp writes _downloads/ here. Pi: set MUSIC_HOST_DIR=/mnt/backup/tapes in .env
      - ${MUSIC_HOST_DIR:-../tapes/music}:/data/music
    expose:
      - "5003"
    labels:
      homehub.enable: "true"
      homehub.name: "Music"
      homehub.route: "/music/"
      homehub.icon: "music"
      homehub.description: "Cassette-deck streaming"
    command:
      - sh
      - -c
      - exec uv run gunicorn 'app:create_app()' -c gunicorn.conf.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5003/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


  # MCP server: lets AI assistants (any MCP client) use calendar, music and
  # library as the signed-in user. See docs/mcp-plan.md and mcp/README.md.
  # Not in nginx's depends_on: nginx resolves it per request, so a broken
  # mcp build never takes the rest of the stack down.
  mcp:
    build: ./mcp
    image: mcp:dev
    container_name: mcp
    restart: unless-stopped
    environment:
      # How clients reach nginx; the OAuth issuer and resource URLs derive from it.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://home.local}
      DASHBOARD_URL: http://dashboard:8000
      CALENDAR_URL: http://calendar:5002
      TAPES_URL: http://music:5003
      LIBRARY_URL: http://library:5001
      TZ: ${TZ:-Europe/London}
    volumes:
      # Named volume: Docker seeds it from the image's /data, already owned by
      # the app user (uid 10001). Holds OAuth grants + the activity log only;
      # losing it just means reconnecting assistants.
      - mcp-data:/data
    expose:
      - "8100"
    depends_on:
      dashboard:
        condition: service_healthy

volumes:
  mcp-data:
