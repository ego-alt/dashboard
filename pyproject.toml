[project]
name = "dashboard"
version = "0.1.0"
description = "Home-services dashboard: auth provider, Docker monitor, service registry."
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1",
    "fastapi>=0.115",
    "passlib[argon2]>=1.7",
    "psutil>=7.0",
    "pydantic>=2.11",
    "pyotp>=2.9",
    "python-dotenv>=1.1",
    "python-multipart>=0.0.28",
    "qrcode>=7.4",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
    "webauthn>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
