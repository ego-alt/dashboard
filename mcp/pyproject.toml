[project]
name = "homehub-mcp"
version = "0.1.0"
description = "Model-agnostic MCP server for the home stack (calendar, tapes, library)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.3,<3",
    "uvicorn>=0.31",
]

[project.scripts]
homehub-mcp = "homehub_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homehub_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
